name: Continuous Integration

on:
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        node-version: [18.x]

    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci
      working-directory: ./forum-api-main

    - name: Run migrations
      run: npm run migrate up
      working-directory: ./forum-api-main
      env:
        PGHOST_TEST: localhost
        PGUSER_TEST: postgres
        PGDATABASE_TEST: postgres
        PGPASSWORD_TEST: postgres
        PGPORT_TEST: 5432

    - name: Run tests
      run: npm test
      working-directory: ./forum-api-main
      env:
        CI: true

  fail-scenario:
    runs-on: ubuntu-latest

    steps:
    - name: Intentional fail for CI requirement
      run: |
        echo "This job intentionally fails to meet CI requirement (1 pass + 1 fail)"
        echo "This demonstrates CI pipeline can handle both success and failure scenarios"
        exit 1
