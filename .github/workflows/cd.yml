name: Continuous Deployment

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📦 Checkout Code
      uses: actions/checkout@v3
    
    - name: 🔑 Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'
    
    - name: 📥 Install Dependencies
      run: npm ci
    
    - name: 🏗️ Build Docker Image
      run: docker build -t forum-api:${{ github.sha }} .
    
    - name: 🚀 Deploy to Railway
      run: |
        echo "📋 Installing Railway CLI..."
        npm install -g @railway/cli
        
        echo "🔐 Authenticating with Railway..."
        export RAILWAY_TOKEN="${{ secrets.RAILWAY_TOKEN }}"
        
        echo "📤 Deploying to Railway..."
        railway deploy --force
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    
    - name: ⏳ Wait for Deployment
      run: sleep 30
    
    - name: 🏥 Health Check
      run: |
        echo "🔍 Verifying deployment health..."
        HEALTH=$(curl -s https://forum-api-production-5ea8.up.railway.app/health)
        
        if echo "$HEALTH" | grep -q '"status":"ok"'; then
          echo "✅ API Health Check Passed"
          echo "✅ Database: $(echo "$HEALTH" | grep -o '"database":"[^"]*"')"
        else
          echo "❌ Health check failed:"
          echo "$HEALTH"
          exit 1
        fi
    
    - name: 🧪 Smoke Test - Critical Endpoints
      run: |
        echo "Testing critical endpoints..."
        
        echo "  Testing GET /status..."
        curl -f https://forum-api-production-5ea8.up.railway.app/status > /dev/null || exit 1
        
        echo "  ✅ Status endpoint working"
    
    - name: ✅ Deployment Success
      run: |
        echo "🎉 Deployment completed successfully!"
        echo "📍 API URL: https://forum-api-production-5ea8.up.railway.app"
        echo "📊 Check Railway dashboard for detailed logs"
    
    - name: ❌ Deployment Failed Notification
      if: failure()
      run: |
        echo "⚠️ Deployment failed!"
        echo "🔗 Check Railway logs: https://railway.app/dashboard"
        exit 1
