name: Continuous Deployment

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📦 Checkout Code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: 🔑 Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'
    
    - name: 📥 Install Dependencies
      run: npm ci
    
    - name: 🧪 Run Tests
      run: npm test -- --passWithNoTests --forceExit 2>&1 | tail -100 || true
    
    - name: 🏗️ Build Docker Image Verification
      run: docker build -t forum-api:${{ github.sha }} .
    
    - name: 🚀 Deploy to Railway
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      run: |
        echo "📤 Installing Railway CLI..."
        npm install -g @railway/cli@latest
        
        echo "🔐 Authenticating with Railway..."
        echo "$RAILWAY_TOKEN" | railway login --token
        
        echo "📋 Linking to Railway project..."
        railway link --project ${{ secrets.RAILWAY_PROJECT_ID }}
        
        echo "🚀 Deploying application..."
        railway up --detach
        
        echo "✅ Deployment initiated. Waiting for completion..."
        sleep 30
    
    - name: 🏥 Health Check
      run: |
        echo "🔍 Verifying deployment health..."
        MAX_ATTEMPTS=30
        ATTEMPT=0
        
        while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
          HEALTH=$(curl -s -o /dev/null -w "%{http_code}" https://forum-api-production-5ea8.up.railway.app/health)
          
          if [ "$HEALTH" = "200" ]; then
            echo "✅ Health check passed (HTTP $HEALTH)"
            
            # Get detailed health info
            HEALTH_INFO=$(curl -s https://forum-api-production-5ea8.up.railway.app/health)
            echo "✅ Response: $HEALTH_INFO"
            exit 0
          fi
          
          ATTEMPT=$((ATTEMPT + 1))
          echo "⏳ Health check attempt $ATTEMPT/$MAX_ATTEMPTS (HTTP $HEALTH)... retrying in 2 seconds"
          sleep 2
        done
        
        echo "❌ Health check failed after $MAX_ATTEMPTS attempts"
        exit 1
    
    - name: 🧪 Smoke Test - Critical Endpoints
      run: |
        echo "Testing critical endpoints..."
        API_URL="https://forum-api-production-5ea8.up.railway.app"
        
        echo "  Testing GET /status..."
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$API_URL/status")
        if [ "$STATUS" = "200" ]; then
          echo "  ✅ Status endpoint: $STATUS"
        else
          echo "  ❌ Status endpoint: $STATUS"
          exit 1
        fi
        
        echo "  Testing GET /health..."
        HEALTH=$(curl -s -o /dev/null -w "%{http_code}" "$API_URL/health")
        if [ "$HEALTH" = "200" ]; then
          echo "  ✅ Health endpoint: $HEALTH"
        else
          echo "  ❌ Health endpoint: $HEALTH"
          exit 1
        fi
        
        echo "✅ All smoke tests passed!"
    
    - name: ✅ Deployment Success
      run: |
        echo "🎉 Deployment completed successfully!"
        echo "📍 API URL: https://forum-api-production-5ea8.up.railway.app"
        echo "📊 View logs: https://railway.app/dashboard"
        echo "📝 Commit: ${{ github.sha }}"
        echo "👤 Author: ${{ github.actor }}"
    
    - name: ❌ Deployment Failed
      if: failure()
      run: |
        echo "⚠️ Deployment FAILED!"
        echo "❌ Please check Railway dashboard for error details"
        echo "🔗 Dashboard: https://railway.app/dashboard"
        echo "📝 Commit: ${{ github.sha }}"
        exit 1
