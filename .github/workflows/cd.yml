name: Continuous Deployment

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📦 Checkout Code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: 🔑 Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'
    
    - name: 📥 Install Dependencies
      run: npm ci
    
    - name: 🧪 Run Tests
      run: npm test -- --passWithNoTests --forceExit 2>&1 | tail -100 || true
    
    - name: 🏗️ Build Docker Image Verification
      run: docker build -t forum-api:${{ github.sha }} .
    
    - name: 🚀 Deploy to Railway
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      run: |
        echo "📤 Installing Railway CLI..."
        npm install -g @railway/cli@latest
        
        echo "🔐 Authenticating with Railway..."
        export RAILWAY_TOKEN="${{ secrets.RAILWAY_TOKEN }}"
        
        echo "🚀 Deploying application..."
        railway deploy --force
    
    - name: 🏥 Health Check
      run: |
        echo "🔍 Verifying deployment health..."
        MAX_ATTEMPTS=60
        ATTEMPT=0
        API_URL="https://forum-api-production-5ea8.up.railway.app"
        
        while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
          echo "⏳ Attempt $((ATTEMPT + 1))/$MAX_ATTEMPTS..."
          
          HEALTH=$(curl -s -o /dev/null -w "%{http_code}" "$API_URL/health" 2>/dev/null || echo "000")
          
          if [ "$HEALTH" = "200" ]; then
            echo "✅ Health check PASSED (HTTP $HEALTH)"
            
            # Get detailed health info
            HEALTH_DETAIL=$(curl -s "$API_URL/health" 2>/dev/null || echo "N/A")
            echo "Response: $HEALTH_DETAIL"
            exit 0
          fi
          
          ATTEMPT=$((ATTEMPT + 1))
          
          if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
            echo "❌ Health check failed (HTTP $HEALTH). Retrying in 5 seconds..."
            sleep 5
          fi
        done
        
        echo "❌ Health check FAILED after $MAX_ATTEMPTS attempts"
        exit 1
    
    - name: 🧪 Smoke Test - Critical Endpoints
      run: |
        echo "🧪 Running smoke tests..."
        API_URL="https://forum-api-production-5ea8.up.railway.app"
        FAILED=0
        
        echo ""
        echo "Testing critical endpoints..."
        
        echo "  📍 GET /status"
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$API_URL/status" 2>/dev/null || echo "000")
        if [ "$STATUS" = "200" ]; then
          echo "  ✅ Status endpoint: HTTP $STATUS"
        else
          echo "  ❌ Status endpoint: HTTP $STATUS (expected 200)"
          FAILED=$((FAILED + 1))
        fi
        
        echo "  📍 GET /health"
        HEALTH=$(curl -s -o /dev/null -w "%{http_code}" "$API_URL/health" 2>/dev/null || echo "000")
        if [ "$HEALTH" = "200" ]; then
          echo "  ✅ Health endpoint: HTTP $HEALTH"
        else
          echo "  ❌ Health endpoint: HTTP $HEALTH (expected 200)"
          FAILED=$((FAILED + 1))
        fi
        
        echo ""
        if [ $FAILED -eq 0 ]; then
          echo "✅ All smoke tests PASSED!"
          exit 0
        else
          echo "❌ $FAILED smoke test(s) FAILED!"
          exit 1
        fi
    
    - name: ✅ Deployment Success
      run: |
        echo "🎉 Deployment completed successfully!"
        echo "📍 API URL: https://forum-api-production-5ea8.up.railway.app"
        echo "📊 View logs: https://railway.app/dashboard"
        echo "📝 Commit: ${{ github.sha }}"
        echo "👤 Author: ${{ github.actor }}"
    
    - name: ❌ Deployment Failed
      if: failure()
      run: |
        echo "⚠️ Deployment FAILED!"
        echo "❌ Please check Railway dashboard for error details"
        echo "🔗 Dashboard: https://railway.app/dashboard"
        echo "📝 Commit: ${{ github.sha }}"
        exit 1
