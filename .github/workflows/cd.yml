name: Continuous Deployment

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'
    
    - name: Install Dependencies
      run: npm ci
    
    - name: Build Docker Image (Verification)
      run: docker build -t forum-api:${{ github.sha }} .
    
    - name: Install Railway CLI
      run: npm install -g @railway/cli@latest
    
    - name: Deploy to Railway
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      run: |
        echo "Setting up Railway CLI..."
        
        if [ -z "$RAILWAY_TOKEN" ]; then
          echo "Error: RAILWAY_TOKEN secret not found!"
          echo "Please add RAILWAY_TOKEN to GitHub Secrets"
          exit 1
        fi
        
        echo "Deploying application to Railway..."
        railway link --project ${{ secrets.RAILWAY_PROJECT_ID }} --service forum-api
        railway up
        
        echo "Deployment completed!"
    
    - name: Wait for Deployment Health Check
      run: |
        echo "Verifying deployment is healthy..."
        MAX_ATTEMPTS=60
        ATTEMPT=0
        API_URL="https://forum-api-production-5ea8.up.railway.app"
        
        while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
          HEALTH=$(curl -s -o /dev/null -w "%{http_code}" "$API_URL/health" 2>/dev/null || echo "000")
          
          if [ "$HEALTH" = "200" ]; then
            echo "API is healthy (HTTP $HEALTH)"
            break
          fi
          
          ATTEMPT=$((ATTEMPT + 1))
          if [ $((ATTEMPT % 12)) -eq 0 ]; then
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS - Still waiting (last HTTP: $HEALTH)..."
          fi
          sleep 5
        done
        
        if [ "$HEALTH" != "200" ]; then
          echo "Deployment health check failed after $MAX_ATTEMPTS attempts"
          exit 1
        fi
        
        echo "Deployment health check passed!"
    
    - name: Smoke Test - Critical Endpoints
      run: |
        echo "Running smoke tests..."
        API_URL="https://forum-api-production-5ea8.up.railway.app"
        
        echo "Testing GET /health..."
        curl -f "$API_URL/health" > /dev/null && echo "  /health endpoint working" || exit 1
        
        echo "Testing GET /status..."
        curl -f "$API_URL/status" > /dev/null && echo "  /status endpoint working" || exit 1
        
        echo "All smoke tests passed!"
    
    - name: Deployment Success
      run: |
        echo "Deployment completed successfully!"
        echo "API URL: https://forum-api-production-5ea8.up.railway.app"
        echo "Check Railway dashboard: https://railway.app/dashboard"
    
    - name: Deployment Failed Notification
      if: failure()
      run: |
        echo "Deployment verification failed!"
        echo "Check Railway logs: https://railway.app/dashboard"
        exit 1
