name: Continuous Deployment

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📦 Checkout Code
      uses: actions/checkout@v3
    
    - name: 🔑 Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'
    
    - name: 📥 Install Dependencies
      run: npm ci
    
    - name: 🏗️ Build Docker Image (Verification)
      run: docker build -t forum-api:${{ github.sha }} .
    
    - name: 📢 Deployment Notice
      run: |
        echo "🚀 Deployment Initiated"
        echo "========================"
        echo "✅ Code validated and ready for deployment"
        echo "✅ Docker image builds successfully"
        echo ""
        echo "📋 Railway Auto-Deploy will:"
        echo "  1. Detect this push to master branch"
        echo "  2. Pull latest code from GitHub"
        echo "  3. Build Docker image automatically"
        echo "  4. Deploy to Railway service"
        echo "  5. Database will be initialized on startup"
        echo ""
        echo "⏳ Estimated deployment time: 2-3 minutes"
        echo ""
        echo "📊 Monitor at: https://railway.app/dashboard"
        echo "🔍 Check health: https://forum-api-production-5ea8.up.railway.app/health"
    
    - name: ⏳ Wait for Railway Deployment
      run: |
        echo "Waiting for Railway auto-deploy to complete..."
        sleep 45
    
    - name: 🏥 Health Check
      run: |
        echo "🔍 Verifying deployment health..."
        HEALTH=$(curl -s https://forum-api-production-5ea8.up.railway.app/health)
        
        if echo "$HEALTH" | grep -q '"status":"ok"'; then
          echo "✅ API Health Check Passed"
          echo "✅ Database: $(echo "$HEALTH" | grep -o '"database":"[^"]*"')"
        else
          echo "❌ Health check failed:"
          echo "$HEALTH"
          exit 1
        fi
    
    - name: 🧪 Smoke Test - Critical Endpoints
      run: |
        echo "Testing critical endpoints..."
        
        echo "  Testing GET /status..."
        curl -f https://forum-api-production-5ea8.up.railway.app/status > /dev/null || exit 1
        
        echo "  ✅ Status endpoint working"
    
    - name: ✅ Deployment Success
      run: |
        echo "🎉 Deployment completed successfully!"
        echo "📍 API URL: https://forum-api-production-5ea8.up.railway.app"
        echo "📊 Check Railway dashboard for detailed logs"
    
    - name: ❌ Deployment Failed Notification
      if: failure()
      run: |
        echo "⚠️ Deployment verification failed!"
        echo "🔗 Check Railway logs: https://railway.app/dashboard"
        exit 1
