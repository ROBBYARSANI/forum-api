# NGINX Rate Limiting Configuration for Forum API
# This configuration provides tiered rate limiting for security and performance

# Rate limit zones by endpoint type
limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=users:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=threads:10m rate=90r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=150r/m;

server {
    listen 80;
    server_name forum-api-production-5ea8.up.railway.app;

    # Authentication endpoints - strict limit (prevent brute force attacks)
    location ~ ^/authentications {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # User registration - moderate limit (prevent spam registration)
    location ~ ^/users$ {
        limit_req zone=users burst=3 nodelay;
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Threads endpoint - moderate rate limit for forum operations
    location ~ ^/threads {
        limit_req zone=threads burst=10 nodelay;
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health and status endpoints - no rate limit (for monitoring)
    location ~ ^/(health|status)$ {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # All other endpoints - general rate limit
    location / {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
