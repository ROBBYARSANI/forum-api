# NGINX Configuration for Forum API
# Simple reverse proxy to Node.js application
# Rate limiting is handled at application level (see src/Infrastructures/http/RateLimiter.js)

upstream forum_api {
    server localhost:8080;
}

server {
    listen 80;
    server_name forum-api-production-5ea8.up.railway.app;

    # Default location - proxy to application
    location / {
        proxy_pass http://forum_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
