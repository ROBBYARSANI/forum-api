worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Rate limit: 90 requests per minute per IP
    limit_req_zone $binary_remote_addr zone=threads_limit:10m rate=90r/m;

    server {
        listen 80;
        server_name localhost;

        # Default routes (NO rate limit)
        location / {
            proxy_pass http://localhost:5000;
        }

        # Exact /threads endpoint
        location = /threads {
            limit_req zone=threads_limit burst=0 nodelay;
            limit_req_status 429;
            proxy_pass http://localhost:5000;
        }

        # /threads and all subpaths
        location /threads/ {
            limit_req zone=threads_limit burst=0 nodelay;
            limit_req_status 429;
            proxy_pass http://localhost:5000;
        }
    }
}
