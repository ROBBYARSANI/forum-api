# NGINX Configuration for Forum API - Railway Deployment
# Rate limiting is implemented at application level using hapi-rate-limiter
# This nginx.conf serves as reverse proxy for Railway deployment

# Rate limiting zone for threads endpoint (if needed at nginx level)
limit_req_zone $binary_remote_addr zone=threads:10m rate=90r/m;

# Upstream to Railway application
upstream railway_app {
    server railway.internal:8080;  # Railway internal port
}

server {
    listen 80;
    server_name forum-api-production-5ea8.up.railway.app;

    # SSL is handled by Railway automatically
    # This config serves as documentation of rate limiting approach

    # Rate limiting for /threads paths (implemented at app level)
    location /threads {
        # Rate limiting handled by hapi-rate-limiter in Node.js application
        # limit_req zone=threads burst=10 nodelay;

        # Proxy to Railway application
        proxy_pass http://railway_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://railway_app;
        proxy_set_header Host $host;
        access_log off;
    }

    # Status endpoint
    location /status {
        proxy_pass http://railway_app;
        proxy_set_header Host $host;
    }

    # Other API endpoints
    location / {
        proxy_pass http://railway_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
    }
}

