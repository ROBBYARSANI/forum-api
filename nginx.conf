# NGINX Rate Limiting Configuration for Forum API
# Limit access to /threads endpoint: 90 requests per minute

limit_req_zone $binary_remote_addr zone=threads:10m rate=90r/m;

server {
    listen 80;
    server_name forum-api-production-5ea8.up.railway.app;

    # Rate limiting for /threads and its subpaths
    location /threads {
        limit_req zone=threads burst=10 nodelay;

        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Other endpoints (no rate limit)
    location / {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
