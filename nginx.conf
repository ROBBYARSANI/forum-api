# Rate limiting configuration for Forum API
# Limit requests to /threads and sub-paths to 90 requests per minute

limit_req_zone $binary_remote_addr zone=threads:10m rate=90r/m;

server {
    listen 80;
    server_name your-domain.com;  # Replace with your domain

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;  # Replace with your domain

    # SSL configuration
    ssl_certificate /path/to/your/certificate.crt;  # Replace with actual path
    ssl_certificate_key /path/to/your/private.key;  # Replace with actual path

    # Rate limiting for /threads paths
    location /threads {
        limit_req zone=threads burst=10 nodelay;

        # Proxy to your application
        proxy_pass http://localhost:5000;  # Adjust port as needed
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Other locations can be added here
    location / {
        proxy_pass http://localhost:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
