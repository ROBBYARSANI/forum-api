# NGINX Configuration for Forum API
# Rate Limiting Configuration and Reverse Proxy

# Rate limit zone: 90 requests per minute for /threads endpoint
# Note: This configuration is for local deployment with Docker Compose
# For Railway deployment, rate limiting is handled at application level
# (see src/Infrastructures/http/RateLimiter.js)
limit_req_zone $binary_remote_addr zone=threads_limit:10m rate=90r/m;

upstream forum_api {
    server forum-api:8080;
}

server {
    listen 80;
    server_name localhost forum-api-production-5ea8.up.railway.app;

    # Default location - proxy to application
    location / {
        proxy_pass http://forum_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Rate limited location for /threads and sub-paths
    # This applies 90 requests per minute limit
    location /threads {
        limit_req zone=threads_limit burst=10 nodelay;

        proxy_pass http://forum_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
